<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet Adoption — Admin Panel</title>

  <style>
    :root {
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#2563eb;
      --bg-overlay: rgba(255,255,255,0.7); /* FIXED */
    }

    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=compress&cs=tinysrgb&w=1600')
        center/cover no-repeat fixed;
      margin: 0;
      padding: 20px;
      color: #111;
    }

    /* Light / Dark Mode */
    body.light {
      --card: #ffffff;
      --text: #111;
      --muted: #555;
      --bg-overlay: rgba(255,255,255,0.7);
    }

    body.dark {
      --card: #1e1e1e;
      --text: #f5f5f5;
      --muted: #bbb;
      --bg-overlay: rgba(0,0,0,0.55);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    /* Layout Styling */
    .container { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 1.4rem; }

    .grid { display: grid; grid-template-columns: 1fr 420px; gap: 18px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 6px 18px rgba(17,24,39,0.08); }

    .paw { position: absolute; width: 60px; opacity: 0.15; user-select: none; }
    .paw.p1 { top: 20px; left: 20px; }
    .paw.p2 { bottom: 40px; right: 30px; }
    .paw.p3 { top: 50%; left: 80%; transform: translate(-50%,-50%); }

    input, select, textarea {
      width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #e6e7ee; font-size: 0.95rem;
    }

    button {
      background: var(--accent); color: white; padding: 8px 10px;
      border: none; border-radius: 8px; cursor: pointer;
    }

    .pet-item { display: flex; gap: 10px; align-items: center; }
    .pet-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; }

    .muted { color: var(--muted); font-size: 0.9rem; }
    .top-controls { display: flex; gap: 8px; }
    .search { padding: 8px; border-radius: 8px; border: 1px solid #e6e7ee; }

    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body class="light">

  <!-- PAW DECORATIONS -->
  <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" class="paw p1" />
  <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" class="paw p2" />
  <img src="https://cdn-icons-png.flaticon.com/512/2099/2099153.png" class="paw p3" />

  <div class="container">

    <header>
      <button id="modeToggle" style="background:#fff;color:#111;">Toggle Mode</button>
      <h1>Pet Adoption — Admin Panel</h1>
      <div class="top-controls">
        <input id="searchInput" class="search" placeholder="Search pets..." />
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
      </div>
    </header>

    <!-- LEFT SECTION: PETS -->
    <div class="grid">
      <section class="card">
        <h2>Add / Edit Pet</h2>

        <form id="petForm">
          <input type="hidden" id="petId">

          <div class="row" style="display:flex;gap:8px;">
            <div style="flex:1">
              <label>Name</label>
              <input id="petName" required>
            </div>
            <div style="width:140px">
              <label>Age</label>
              <input id="petAge" type="number">
            </div>
          </div>

          <div class="row" style="display:flex;gap:8px;">
            <div style="flex:1">
              <label>Species</label>
              <select id="petSpecies"><option>Dog</option><option>Cat</option><option>Other</option></select>
            </div>
            <div style="width:140px">
              <label>Sex</label>
              <select id="petSex"><option>Male</option><option>Female</option></select>
            </div>
          </div>

          <div class="row" style="display:flex;gap:8px;">
            <div style="flex:1">
              <label>Breed</label>
              <input id="petBreed">
            </div>
            <div style="width:140px">
              <label>Image URL</label>
              <input id="petImage">
            </div>
          </div>

          <label>Description</label>
          <textarea id="petDesc" rows="3"></textarea>

          <div style="margin-top:8px;display:flex;gap:8px;">
            <button type="submit">Save Pet</button>
            <button type="button" id="clearPet">Clear</button>
          </div>
        </form>

        <hr/>
        <h3>Available Pets</h3>
        <div id="petList"></div>
      </section>

      <!-- RIGHT SECTION -->
      <aside>

        <!-- NUTRIENTS -->
        <div class="card">
          <h3>Nutrient Chart</h3>

          <form id="nutrientForm" style="display:flex;gap:8px;flex-direction:column">
            <input id="nutType" placeholder="Type (e.g. Adult Dog)" required>

            <div class="row" style="display:flex;gap:8px;">
              <input id="calories" type="number" placeholder="Calories/day">
              <input id="protein" type="number" placeholder="Protein (g)">
              <input id="fat" type="number" placeholder="Fat (g)">
              <input id="carb" type="number" placeholder="Carbs (g)">
            </div>

            <div style="display:flex;gap:8px;">
              <button type="button" id="addNutrientBtn">Save Row</button>
              <button type="button" id="clearNutrient">Clear</button>
            </div>
          </form>

          <table id="nutrientTable">
            <thead>
              <tr><th>Type</th><th>Cal</th><th>Protein</th><th>Fat</th><th>Carbs</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- VETERINARY -->
        <div class="card" style="margin-top:12px">
          <h3>Vet Contacts</h3>

          <form id="vetForm" style="display:flex;gap:8px;flex-direction:column">
            <input id="vetName" placeholder="Clinic Name" required>
            <input id="vetPhone" placeholder="Phone" required>
            <input id="vetAddress" placeholder="Address">
            <div style="display:flex;gap:8px;">
              <button type="button" id="addVetBtn">Save Contact</button>
              <button type="button" id="clearVet">Clear</button>
            </div>
          </form>

          <table id="vetTable">
            <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

      </aside>
    </div>

    <div class="card">
      <h3>Help & Tips</h3>
      <p class="muted">Data saves in your local browser using localStorage.</p>
    </div>
  </div>

  <script>
    /* STORAGE */
    const LS_KEYS = {
      pets: 'pa_pets_v1',
      nutrients: 'pa_nutrients_v1',
      vets: 'pa_vets_v1'
    };

    function load(k){ return JSON.parse(localStorage.getItem(k) || "[]"); }
    function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

    function escapeHtml(s){
      if(!s) return "";
      return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    /* PETS */
    const petForm = document.getElementById('petForm');
    const petListEl = document.getElementById('petList');
    const searchInput = document.getElementById('searchInput');

    function renderPets(filter=""){
      const pets = load(LS_KEYS.pets);
      petListEl.innerHTML = "";

      pets.filter(p => (p.name+p.species+(p.breed||""))
        .toLowerCase().includes(filter.toLowerCase()))
      .forEach(p => {
        const div = document.createElement('div');
        div.className = "pet-item card";
        div.style.padding = "10px";

        div.innerHTML = `
          <img src="${p.image||'https://via.placeholder.com/120'}">
          <div style="flex:1">
            <strong>${escapeHtml(p.name)}</strong>
            <div class="small">${escapeHtml(p.species)} — ${escapeHtml(p.breed||"")}</div>
            <div class="small">Age: ${p.age||"N/A"} • ${escapeHtml(p.sex)}</div>
            <div class="small">${escapeHtml(p.desc||"")}</div>
          </div>
          <div>
            <button class="editBtn" data-id="${p.id}">Edit</button>
            <button class="delBtn" data-id="${p.id}">Delete</button>
          </div>
        `;
        petListEl.appendChild(div);
      });
    }

    petForm.addEventListener('submit', e=>{
      e.preventDefault();

      const id = document.getElementById('petId').value || Date.now();
      const pet = {
        id,
        name: petName.value.trim(),
        age: petAge.value,
        species: petSpecies.value,
        sex: petSex.value,
        breed: petBreed.value,
        image: petImage.value,
        desc: petDesc.value
      };

      const pets = load(LS_KEYS.pets).filter(p=>p.id!=id);
      pets.push(pet);
      save(LS_KEYS.pets, pets);

      petForm.reset();
      document.getElementById('petId').value = "";
      renderPets(searchInput.value);
    });

    document.getElementById('clearPet').onclick = ()=> petForm.reset();

    petListEl.addEventListener('click', e=>{
      if(e.target.classList.contains('delBtn')){
        const id = e.target.dataset.id;
        const pets = load(LS_KEYS.pets).filter(p=>p.id!=id);
        save(LS_KEYS.pets, pets);
        renderPets(searchInput.value);
      }

      if(e.target.classList.contains('editBtn')){
        const id = e.target.dataset.id;
        const p = load(LS_KEYS.pets).find(x=>x.id==id);

        petId.value = p.id;
        petName.value = p.name;
        petAge.value = p.age;
        petSpecies.value = p.species;
        petSex.value = p.sex;
        petBreed.value = p.breed;
        petImage.value = p.image;
        petDesc.value = p.desc;
      }
    });

    searchInput.addEventListener('input',()=>renderPets(searchInput.value));

    /* NUTRIENTS */
    const nutrientBody = document.querySelector("#nutrientTable tbody");

    function renderNutrients(){
      nutrientBody.innerHTML="";
      load(LS_KEYS.nutrients).forEach((n,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(n.type)}</td>
          <td>${n.cal||""}</td>
          <td>${n.pro||""}</td>
          <td>${n.fat||""}</td>
          <td>${n.car||""}</td>
          <td>
            <button class="editNut" data-i="${i}">Edit</button>
            <button class="delNut" data-i="${i}">Delete</button>
          </td>
        `;
        nutrientBody.appendChild(tr);
      });
    }

    document.getElementById("addNutrientBtn").onclick = ()=>{
      const items = load(LS_KEYS.nutrients);
      const item = {
        type: nutType.value.trim(),
        cal: calories.value,
        pro: protein.value,
        fat: fat.value,
        car: carb.value
      };

      const idx = items.findIndex(x => x.type.toLowerCase() == item.type.toLowerCase());
      if(idx>=0) items[idx] = item;
      else items.push(item);

      save(LS_KEYS.nutrients, items);
      nutrientForm.reset();
      renderNutrients();
    };

    nutrientBody.addEventListener("click", e=>{
      const i = e.target.dataset.i;
      const rows = load(LS_KEYS.nutrients);

      if(e.target.classList.contains("delNut")){
        rows.splice(i,1);
        save(LS_KEYS.nutrients, rows);
        renderNutrients();
      }

      if(e.target.classList.contains("editNut")){
        const r = rows[i];
        nutType.value = r.type;
        calories.value = r.cal;
        protein.value = r.pro;
        fat.value = r.fat;
        carb.value = r.car;
      }
    });

    document.getElementById("clearNutrient").onclick = ()=> nutrientForm.reset();

    /* VETS */
    const vetBody = document.querySelector("#vetTable tbody");

    function renderVets(){
      vetBody.innerHTML = "";
      load(LS_KEYS.vets).forEach((v,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(v.name)}</td>
          <td><a href="tel:${v.phone}">${escapeHtml(v.phone)}</a></td>
          <td>${escapeHtml(v.address||"")}</td>
          <td>
            <button class="editVet" data-i="${i}">Edit</button>
            <button class="delVet" data-i="${i}">Delete</button>
          </td>
        `;
        vetBody.appendChild(tr);
      });
    }

    document.getElementById("addVetBtn").onclick = ()=>{
      const name = vetName.value.trim();
      const phone = vetPhone.value.trim();

      if(!name || !phone){
        alert("Name & phone required");
        return;
      }

      const vets = load(LS_KEYS.vets);
      vets.push({
        name, phone,
        address: vetAddress.value
      });

      save(LS_KEYS.vets, vets);
      vetForm.reset();
      renderVets();
    };

    vetBody.addEventListener("click", e=>{
      const i = e.target.dataset.i;
      const vets = load(LS_KEYS.vets);

      if(e.target.classList.contains("delVet")){
        vets.splice(i,1);
        save(LS_KEYS.vets, vets);
        renderVets();
      }

      if(e.target.classList.contains("editVet")){
        const v = vets[i];

        vetName.value = v.name;
        vetPhone.value = v.phone;
        vetAddress.value = v.address;

        vets.splice(i,1);  // REMOVE OLD ONLY WHEN EDITING
        save(LS_KEYS.vets, vets);
        renderVets();
      }
    });

    document.getElementById("clearVet").onclick = ()=> vetForm.reset();

    /* EXPORT / IMPORT */
    document.getElementById("exportBtn").onclick = ()=>{
      const blob = new Blob([JSON.stringify({
        pets: load(LS_KEYS.pets),
        nutrients: load(LS_KEYS.nutrients),
        vets: load(LS_KEYS.vets)
      }, null, 2)], {type:"application/json"});

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pet-adoption-data.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById("importBtn").onclick = ()=>{
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json";

      input.onchange = e=>{
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = ev=>{
          try{
            const obj = JSON.parse(ev.target.result);
            if(obj.pets) save(LS_KEYS.pets, obj.pets);
            if(obj.nutrients) save(LS_KEYS.nutrients, obj.nutrients);
            if(obj.vets) save(LS_KEYS.vets, obj.vets);
            renderAll();
          }catch(err){
            alert("Invalid JSON file");
          }
        };
        reader.readAsText(file);
      };

      input.click();
    };

    /* RENDER ALL */
    function renderAll(){
      renderPets();
      renderNutrients();
      renderVets();
    }

    /* SAMPLE DATA */
    window.onload = ()=>{
      if(!localStorage.getItem(LS_KEYS.pets)){
        save(LS_KEYS.pets, [{
          id:"p1",
          name:"Buddy",
          age:3,
          species:"Dog",
          sex:"Male",
          breed:"Labrador",
          image:"https://images.pexels.com/photos/4587998/pexels-photo-4587998.jpeg",
          desc:"Friendly and playful."
        }]);
      }

      if(!localStorage.getItem(LS_KEYS.nutrients)){
        save(LS_KEYS.nutrients, [
          {type:"Adult Dog", cal:900, pro:50, fat:30, car:80},
          {type:"Adult Cat", cal:250, pro:30, fat:15, car:20}
        ]);
      }

      if(!localStorage.getItem(LS_KEYS.vets)){
        save(LS_KEYS.vets, [
          {name:"City Vet Clinic", phone:"+91-824-XXXXXXX", address:"Mangalore"},
          {name:"Happy Paws Clinic", phone:"+91-824-YYYYYYY", address:"Bangalore"}
        ]);
      }

      renderAll();
    };

    /* MODE TOGGLE */
    document.getElementById("modeToggle").onclick = ()=>{
      document.body.classList.toggle("light");
      document.body.classList.toggle("dark");
    };
  </script>

</body>
</html>
